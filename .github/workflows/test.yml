name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck theduckpurge
          shellcheck install.sh
          shellcheck test/test_theduckpurge.bats

  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt
          key: apt-${{ matrix.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: apt-${{ matrix.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mat2 libimage-exiftool-perl ffmpeg bats

      - name: Cache Bats helpers
        uses: actions/cache@v4
        with:
          path: test/test_helper
          key: bats-helpers-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: bats-helpers-

      - name: Setup Bats helpers
        run: |
          if [ ! -d "test/test_helper/bats-support" ]; then
            mkdir -p test/test_helper
            git clone --depth 1 https://github.com/bats-core/bats-support.git test/test_helper/bats-support
            git clone --depth 1 https://github.com/bats-core/bats-assert.git  test/test_helper/bats-assert
          fi

      - name: Run Bats tests
        run: bats --print-output-on-failure test/test_theduckpurge.bats
