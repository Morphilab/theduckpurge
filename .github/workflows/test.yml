name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run ShellCheck
        run: |
          shellcheck --version
          shellcheck theduckpurge
          shellcheck install.sh
          shellcheck test/test_theduckpurge.bats

  bats:
    name: Bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mat2 libimage-exiftool-perl ffmpeg bats

      - name: Setup Bats helpers (pinned)
        run: |
          mkdir -p test/test_helper
          git init -q test/test_helper/bats-support
          git -C test/test_helper/bats-support remote add origin https://github.com/bats-core/bats-support.git
          git -C test/test_helper/bats-support fetch --depth 1 -q origin 0954abb9925cad550424cebca2b99255d4eabe96
          git -C test/test_helper/bats-support checkout -q FETCH_HEAD
          git init -q test/test_helper/bats-assert
          git -C test/test_helper/bats-assert remote add origin https://github.com/bats-core/bats-assert.git
          git -C test/test_helper/bats-assert fetch --depth 1 -q origin 697471b7a89d3ab38571f38c6c7c4b460d1f5e35
          git -C test/test_helper/bats-assert checkout -q FETCH_HEAD

      - name: Run Bats tests
        run: bats --print-output-on-failure test/test_theduckpurge.bats
